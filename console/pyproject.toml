[project]
name = "pipelinedoctor-console"
version = "0.2.0" # x-release-please-version
description = "PipelineDoctor Console: occurrence register, investigation reports, eval ledger and DORA metrics."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.142.2",
    "uvicorn==0.54.0",
    "jinja2==3.1.6",
    "httpx==0.28.1",
    "pydantic==2.13.5",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "respx==0.23.1",
    "ruff==0.16.10",
    "mypy==2.4.0",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipelinedoctor_console"]
# static/fonts/ is gitignored (generated by scripts/copy-fonts.mjs). Hatch skips ignored files
# unless they are declared as build artifacts, so the Docker image would ship without fonts.
artifacts = ["src/pipelinedoctor_console/static/fonts/*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
packages = ["pipelinedoctor_console"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
    # Starlette nudges TestClient users towards httpx2; httpx 0.28.1 is the pinned contract.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.coverage.run]
source = ["pipelinedoctor_console"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.uv]
# Transitive dependencies obey the same rule as direct pins: nothing released after the cutoff.
exclude-newer = "2026-10-02T23:59:59Z"
