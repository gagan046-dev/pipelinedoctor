# Stage 05 - security gates.
# Required checks: secret-scan, dependency-review, workflow-policy.
# Findings from Trivy go to the Security tab (code scanning) as SARIF.
name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly re-scan: new CVEs get published for code that did not change.
    - cron: "23 4 * * 1"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read # gitleaks lists the PR's commits
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: a secret committed and then deleted is still leaked.
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_CONFIG: .gitleaks.toml
          # PR comments would need pull-requests: write; the job summary + failed check are enough.
          GITLEAKS_ENABLE_COMMENTS: "false"

  dependency-review:
    name: dependency-review
    # On push the job is skipped, and a skipped required check counts as passed.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write # summary comment when the review fails
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  workflow-policy:
    name: workflow-policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.21"
          enable-cache: true
      - name: actionlint (syntax, expressions, shellcheck of run blocks)
        # The linter image is pinned by digest like any other dependency.
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color
      - name: zizmor (workflow security audit)
        run: uvx zizmor@1.30.1 --offline --min-severity medium .
      - name: Lint workflows against the repository policy
        run: uv run --frozen python scripts/check_workflows.py
      - name: Unit tests of the policy linter
        # -o addopts= ignores the engine's pytest addopts (coverage gate) for this small suite.
        run: uv run --frozen pytest -o addopts= -q scripts/tests

  trivy-fs:
    name: trivy-fs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # upload SARIF to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Pass 1: report everything (per trivy.yaml) as SARIF -> Security tab, never fails.
      - name: Trivy filesystem scan (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          trivy-config: trivy.yaml
          format: sarif
          output: trivy-fs.sarif
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        # Fork PR tokens cannot write security events; do not fail the scan because of that.
        continue-on-error: ${{ github.event.pull_request.head.repo.fork == true }}
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs
      # Pass 2: the gate. Only fixable CRITICAL findings break the build.
      - name: Trivy filesystem gate (CRITICAL, fixable)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          trivy-config: trivy.yaml
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          # The DB was downloaded by pass 1 and is cached by the action.
          skip-setup-trivy: true

  trivy-image:
    name: trivy-image (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: engine
            context: .
            file: Dockerfile
          - image: console
            context: console
            file: console/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image for scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          load: true
          push: false
          tags: pd-${{ matrix.image }}:scan
          # Same cache scope as container.yml: usually a near-instant rebuild. Read-only here.
          cache-from: type=gha,scope=${{ matrix.image }}
      - name: Trivy image scan (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          scan-type: image
          image-ref: pd-${{ matrix.image }}:scan
          scanners: vuln,secret,misconfig
          trivy-config: trivy.yaml
          format: sarif
          output: trivy-image.sarif
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        continue-on-error: ${{ github.event.pull_request.head.repo.fork == true }}
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image-${{ matrix.image }}
      - name: Trivy image gate (CRITICAL, fixable)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          scan-type: image
          image-ref: pd-${{ matrix.image }}:scan
          scanners: vuln,secret,misconfig
          trivy-config: trivy.yaml
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true
