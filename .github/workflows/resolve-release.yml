# Stage 09 - the supply-chain gate in front of every production change, as a reusable workflow.
# deploy.yml and rollback.yml both call it, so a rollback to an older version is held to exactly
# the same standard as a deploy: signed by container.yml on main, with SLSA provenance, and
# pinned by digest (a tag can be moved after it was verified; a digest cannot).
name: Resolve Release

on:
  workflow_call:
    inputs:
      version:
        description: Release version, e.g. 0.2.0 (a leading "v" is accepted).
        type: string
        required: true
    outputs:
      version:
        description: The normalised version (no leading "v").
        value: ${{ jobs.resolve.outputs.version }}
      console-ref:
        description: Verified console image as name@sha256:...
        value: ${{ jobs.resolve.outputs.console-ref }}
      proxy-ref:
        description: Verified proxy image as name@sha256:...
        value: ${{ jobs.resolve.outputs.proxy-ref }}

permissions: {}

env:
  CONSOLE_IMAGE: ghcr.io/gagan046-dev/pipelinedoctor-console
  PROXY_IMAGE: ghcr.io/gagan046-dev/pipelinedoctor-proxy
  # Only signatures made by container.yml on main are trusted.
  CERT_IDENTITY_REGEXP: ^https://github\.com/gagan046-dev/pipelinedoctor/\.github/workflows/container\.yml@refs/heads/main$
  CERT_OIDC_ISSUER: https://token.actions.githubusercontent.com

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read # pull manifests from GHCR
      attestations: read # gh attestation verify
    outputs:
      version: ${{ steps.version.outputs.version }}
      console-ref: ${{ steps.digests.outputs.console-ref }}
      proxy-ref: ${{ steps.digests.outputs.proxy-ref }}
    steps:
      - name: Normalise version
        id: version
        env:
          RAW: ${{ inputs.version }}
        run: |
          v="${RAW#v}"
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must look like 1.2.3, got '${RAW}'"; exit 1
          fi
          echo "version=${v}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve tags to digests
        id: digests
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          resolve() {
            docker buildx imagetools inspect "$1:${VERSION}" --format '{{json .Manifest.Digest}}' | tr -d '"'
          }
          console_digest=$(resolve "$CONSOLE_IMAGE")
          proxy_digest=$(resolve "$PROXY_IMAGE")
          echo "console-ref=${CONSOLE_IMAGE}@${console_digest}" >> "$GITHUB_OUTPUT"
          echo "proxy-ref=${PROXY_IMAGE}@${proxy_digest}" >> "$GITHUB_OUTPUT"
          {
            echo "### Release ${VERSION}"
            echo "| Image | Digest |"
            echo "|---|---|"
            echo "| console | \`${console_digest}\` |"
            echo "| proxy | \`${proxy_digest}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Verify signatures and provenance
        env:
          CONSOLE_REF: ${{ steps.digests.outputs.console-ref }}
          PROXY_REF: ${{ steps.digests.outputs.proxy-ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          for ref in "$CONSOLE_REF" "$PROXY_REF"; do
            cosign verify "$ref" \
              --certificate-identity-regexp "$CERT_IDENTITY_REGEXP" \
              --certificate-oidc-issuer "$CERT_OIDC_ISSUER" > /dev/null
            gh attestation verify "oci://${ref}" -R "$GITHUB_REPOSITORY"
            echo "verified: ${ref}" >> "$GITHUB_STEP_SUMMARY"
          done
