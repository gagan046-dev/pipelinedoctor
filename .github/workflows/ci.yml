# CI for the engine (src/) and the console (console/), built from the reusable workflow.
# Required check: "ci-ok" (one stable aggregate check instead of N matrix check names).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

# One run per PR (or per branch). A new push to a PR cancels the outdated run; main is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # paths-filter lists PR files through the API
    outputs:
      engine: ${{ steps.filter.outputs.engine }}
      console: ${{ steps.filter.outputs.console }}
    steps:
      # On push events paths-filter diffs git history, so it needs a checkout; on PRs it uses the API.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            engine:
              - 'src/**'
              - 'tests/**'
              - 'prompts/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'scripts/**' # the engine lint also covers scripts/ (lint-paths below)
              - '.github/workflows/ci.yml'
              - '.github/workflows/reusable-python-ci.yml'
              - '.github/actions/**'
            console:
              - 'console/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/reusable-python-ci.yml'
              - '.github/actions/**'

  engine:
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    # A job that calls a reusable workflow has no steps (and no timeout-minutes of its own):
    # the called workflow's jobs carry them.
    uses: ./.github/workflows/reusable-python-ci.yml
    permissions:
      contents: read
    with:
      working-directory: "."
      installer: uv
      source-package: pipelinedoctor
      coverage-min: 85
      lint-paths: src tests scripts
      # Windows only on the newest Python: catches path/encoding bugs without doubling the bill.
      matrix: '{"os":["ubuntu-latest","windows-latest"],"python":["3.11","3.12"],"exclude":[{"os":"windows-latest","python":"3.11"}]}'

  console:
    needs: changes
    if: needs.changes.outputs.console == 'true'
    uses: ./.github/workflows/reusable-python-ci.yml
    permissions:
      contents: read
    with:
      working-directory: console
      installer: uv
      source-package: pipelinedoctor_console
      coverage-min: 75
      matrix: '{"os":["ubuntu-latest"],"python":["3.12"]}'

  ci-ok:
    name: ci-ok
    needs: [changes, engine, console]
    # always(): run even when engine/console were skipped by the path filter, so the required
    # check always reports a result (a skipped required check counts as passing, a missing one blocks).
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Aggregate results
        env:
          CHANGES: ${{ needs.changes.result }}
          ENGINE: ${{ needs.engine.result }}
          CONSOLE: ${{ needs.console.result }}
          COVERAGE: ${{ needs.engine.outputs.coverage }}
        run: |
          {
            echo "## CI summary"
            echo "| Job | Result |"
            echo "|---|---|"
            echo "| changes | ${CHANGES} |"
            echo "| engine | ${ENGINE} |"
            echo "| console | ${CONSOLE} |"
            echo ""
            echo "Engine coverage (ubuntu / 3.12): ${COVERAGE:-n/a}%"
          } >> "$GITHUB_STEP_SUMMARY"
          for r in "$CHANGES" "$ENGINE" "$CONSOLE"; do
            if [ "$r" = failure ] || [ "$r" = cancelled ]; then
              echo "::error::A CI job ended with '$r'."
              exit 1
            fi
          done
          echo "All CI jobs succeeded or were skipped by the path filter."
