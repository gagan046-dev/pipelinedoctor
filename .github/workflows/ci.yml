# Stage 03 - the stage-02 gates, made fast and cheap:
#   * path filter job (dorny/paths-filter) -> skip the engine jobs when nothing relevant changed
#   * uv cache keyed by uv.lock
#   * test matrix: Python 3.11 + 3.12 on Ubuntu, 3.12 on Windows, fail-fast: false
#   * concurrency: a new push to a PR cancels the outdated run
#   * timeout-minutes on every job (the default is 360 minutes of billed time!)
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Never cancel runs on main: every main commit should have a complete result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      engine: ${{ steps.filter.outputs.engine }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            engine:
              - 'src/**'
              - 'tests/**'
              - 'prompts/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/ci.yml'

  lint:
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.21"
          python-version: "3.12"
          # The cache key includes a hash of uv.lock: same lock -> restore instead of download.
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      - run: uv run --frozen ruff check --output-format=github src tests
      - run: uv run --frozen ruff format --check --diff src tests

  typecheck:
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.21"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      - run: uv run --frozen mypy src

  test:
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      # false = keep the other legs running when one fails, so you see every broken combination.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
        # Windows only on the newest Python: catches path/encoding bugs at half the cost.
        exclude:
          - os: windows-latest
            python: "3.11"
    # Every leg evaluates this output; only the ubuntu/3.12 leg sets it (see the step "if").
    outputs:
      coverage: ${{ steps.coverage.outputs.percent }}
    defaults:
      run:
        shell: bash # Git Bash on Windows: one script for every OS
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.21"
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      - name: pytest with coverage gate (85%)
        run: |
          uv run --frozen pytest --cov=pipelinedoctor --cov-report=xml --cov-report=term \
            --cov-fail-under=85
      - name: Read total coverage
        id: coverage
        if: always() && matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: |
          if [ -f coverage.xml ]; then
            pct=$(uv run --frozen python -c "import xml.etree.ElementTree as E; print(round(float(E.parse('coverage.xml').getroot().get('line-rate')) * 100, 1))")
            echo "percent=${pct}" >> "$GITHUB_OUTPUT"
          fi

  ci-ok:
    name: ci-ok
    needs: [changes, lint, typecheck, test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Aggregate results
        env:
          CHANGES: ${{ needs.changes.result }}
          LINT: ${{ needs.lint.result }}
          TYPECHECK: ${{ needs.typecheck.result }}
          TEST: ${{ needs.test.result }}
          COVERAGE: ${{ needs.test.outputs.coverage }}
        run: |
          {
            echo "## CI summary"
            echo "| Job | Result |"
            echo "|---|---|"
            echo "| changes | ${CHANGES} |"
            echo "| lint | ${LINT} |"
            echo "| typecheck | ${TYPECHECK} |"
            echo "| test (matrix) | ${TEST} |"
            echo ""
            echo "Coverage (ubuntu / 3.12): ${COVERAGE:-n/a}%"
          } >> "$GITHUB_STEP_SUMMARY"
          # "skipped" is fine: the path filter decided nothing relevant changed.
          for r in "$CHANGES" "$LINT" "$TYPECHECK" "$TEST"; do
            if [ "$r" = failure ] || [ "$r" = cancelled ]; then
              echo "::error::A CI job ended with '$r'."; exit 1
            fi
          done
