# Stage 07 - Conventional Commits on the PR title.
# Squash merges use the PR title as the commit message, and release-please reads those commit
# messages to decide the next version (feat -> minor, fix -> patch, "!" -> major) and the CHANGELOG.
name: PR Title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: pr-title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - name: Validate the title
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          # The title is read inside JavaScript as data (never pasted into a shell command).
          script: |
            const title = context.payload.pull_request.title;
            const pattern = /^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: .{1,72}$/;
            if (pattern.test(title)) {
              core.info(`OK: "${title}"`);
              await core.summary.addRaw(`PR title follows Conventional Commits: \`${title}\``).write();
            } else {
              core.setFailed(
                `PR title "${title}" is not a Conventional Commit.\n` +
                'Expected "<type>(<optional-scope>)!: <summary up to 72 chars>", e.g. "fix(engine): keep ANSI-free line numbers".\n' +
                'Types: feat fix docs style refactor perf test build ci chore revert.\n' +
                'Fix it with: gh pr edit <number> --title "feat: ..."'
              );
            }
