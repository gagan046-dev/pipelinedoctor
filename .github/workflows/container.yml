# Stage 04 - container images with Docker Buildx.
#   pull_request -> build only (proves the Dockerfiles work and warms the cache; pushes nothing)
#   push to main -> build + push to GHCR with tags sha-<7> and edge
# Stage 07 adds workflow_call, version tags, multi-arch, SBOM, provenance and cosign signing.
name: Container

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "src/**"
      - "prompts/**"
      - "pyproject.toml"
      - "uv.lock"
      - "console/**"
      - "deploy/proxy/**"
      - ".github/workflows/container.yml"
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "src/**"
      - "prompts/**"
      - "pyproject.toml"
      - "uv.lock"
      - "console/**"
      - "deploy/proxy/**"
      - ".github/workflows/container.yml"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Fork PRs could not push anyway (read-only token); same-repo PRs must not overwrite tags.
  PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

jobs:
  build:
    name: build (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write # push to ghcr.io with the workflow's own GITHUB_TOKEN
    strategy:
      fail-fast: false
      matrix:
        image: [engine, console, proxy]
        include:
          - image: engine
            context: .
            file: Dockerfile
            name: ghcr.io/gagan046-dev/pipelinedoctor
            title: PipelineDoctor engine
          - image: console
            context: console
            file: console/Dockerfile
            name: ghcr.io/gagan046-dev/pipelinedoctor-console
            title: PipelineDoctor Console
          - image: proxy
            context: deploy/proxy
            file: deploy/proxy/Dockerfile
            name: ghcr.io/gagan046-dev/pipelinedoctor-proxy
            title: PipelineDoctor blue-green proxy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Buildx = BuildKit: parallel multi-stage builds and exportable layer caches.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Turns git context into tags (sha-1a2b3c4, edge) and OCI labels (source, revision, ...).
      - name: Compute tags and OCI labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ matrix.name }}
          tags: |
            type=sha,format=short,prefix=sha-
            type=edge,branch=main
          labels: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.licenses=MIT

      - name: Build (and push on main)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            GIT_SHA=${{ github.sha }}
          # GitHub Actions cache backend: unchanged layers are restored instead of rebuilt.
          # mode=max also caches the intermediate stages of multi-stage Dockerfiles.
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Summary
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ matrix.image }}
        run: |
          {
            echo "### ${IMAGE}"
            echo "Pushed: ${PUSH}"
            echo ""
            echo "Digest: \`${DIGEST:-n/a}\`"
            echo '```'
            echo "${TAGS}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
