# CI for the deliberately breakable demo project (demo/).
# demo/break/apply.py edits the "pd-break-anchor" lines below to cause real failures on a
# break/* branch; PipelineDoctor then diagnoses them on the pull request.
# Do not reformat the anchored steps: the break tool matches their exact text and indentation.
name: Demo CI

on:
  push:
    branches: [main]
    paths:
      - "demo/**"
      - ".github/workflows/demo-ci.yml"
      - ".github/workflows/reusable-python-ci.yml"
      - ".github/actions/setup-python-env/**"
  pull_request:
    # on.paths filters the whole workflow. Fine here because Demo CI is not a required check
    # (a required check that never starts would block merging forever).
    paths:
      - "demo/**"
      - ".github/workflows/demo-ci.yml"
      - ".github/workflows/reusable-python-ci.yml"
      - ".github/actions/setup-python-env/**"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    uses: ./.github/workflows/reusable-python-ci.yml
    permissions:
      contents: read
    with:
      working-directory: demo
      installer: pip
      requirements: requirements-dev.txt
      source-package: invoicer
      coverage-min: 90
      pytest-args: -m "not integration"
      matrix: '{"os":["ubuntu-latest"],"python":["3.11","3.12"]}'

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    # A service container: GitHub starts Postgres next to the job and waits for its health check.
    services:
      postgres:
        image: postgres:17.11-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          # Not a secret: a throwaway database that only lives for this job.
          POSTGRES_PASSWORD: demo
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DEMO_DB_HOST: localhost
      DEMO_DB_USER: postgres
      DEMO_DB_PASSWORD: demo
      DEMO_DB_NAME: postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-env
        with:
          python-version: "3.12"
          working-directory: demo
          installer: pip
      - name: Run integration tests
        timeout-minutes: 3
        env:
          # pd-break-anchor: db
          DEMO_DB_PORT: "5432"
        run: python -m pytest -m integration demo/tests

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build demo image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: demo
          # load: true copies the image from BuildKit into the local Docker engine so "docker run" sees it.
          load: true
          push: false
          tags: pipelinedoctor-demo:ci
          cache-from: type=gha,scope=demo
          cache-to: type=gha,mode=max,scope=demo
      - name: Run unit tests inside the image (256 MiB memory limit)
        # --memory makes the kernel OOM-kill the container (exit 137) if a test allocates too much.
        run: docker run --rm --memory=256m pipelinedoctor-demo:ci python -m pytest -q -m "not integration"

  ops:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Read repository metadata
        # pd-break-anchor: permission
        run: gh api "repos/${GITHUB_REPOSITORY}" --jq .full_name
      - name: Publish dry-run
        env:
          DEMO_PUBLISH_TOKEN: ${{ secrets.DEMO_PUBLISH_TOKEN }}
        # pd-break-anchor: secret
        run: python demo/scripts/publish_dry_run.py --optional-token
      # pd-break-anchor: yaml
