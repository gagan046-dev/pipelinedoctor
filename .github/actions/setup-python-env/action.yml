# Stage 10 - composite action: a reusable *list of steps* that runs inside the caller's job.
# Compare with reusable-python-ci.yml, a reusable *workflow* that brings its own jobs and runners.
name: Set up Python environment
description: Install Python plus project dependencies with uv (lock file) or pip (requirements file), with caching.

inputs:
  python-version:
    description: Python version, e.g. "3.12".
    required: true
  working-directory:
    description: Project directory relative to the repository root.
    default: "."
  installer:
    description: "uv (uses uv.lock) or pip (uses a requirements file)."
    default: uv
  requirements:
    description: Requirements file (pip only), relative to working-directory.
    default: requirements-dev.txt
  uv-version:
    description: Exact uv version.
    default: "0.12.21"

outputs:
  python-version:
    description: The exact Python version that was installed.
    value: ${{ steps.python.outputs.python-version }}

runs:
  using: composite
  steps:
    - name: Validate inputs
      shell: bash
      env:
        INSTALLER: ${{ inputs.installer }}
      run: |
        case "$INSTALLER" in
          uv|pip) ;;
          *) echo "::error::installer must be 'uv' or 'pip', got '$INSTALLER'"; exit 1 ;;
        esac

    - name: Set up Python
      id: python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.python-version }}
        # "cond && a || b" is the expression language's ternary: pip uses setup-python's cache,
        # uv brings its own cache (next step).
        cache: ${{ inputs.installer == 'pip' && 'pip' || '' }}
        cache-dependency-path: ${{ inputs.installer == 'pip' && format('{0}/requirements*.txt', inputs.working-directory) || '' }}

    - name: Set up uv
      if: inputs.installer == 'uv'
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        version: ${{ inputs.uv-version }}
        # Make uv use exactly this matrix leg's interpreter (exports UV_PYTHON for later steps).
        python-version: ${{ steps.python.outputs.python-version }}
        enable-cache: true
        # The cache key contains a hash of the lock file: unchanged lock -> cache hit.
        cache-dependency-glob: ${{ inputs.working-directory }}/uv.lock

    - name: Install dependencies (uv)
      if: inputs.installer == 'uv'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      # --frozen: install exactly what uv.lock says; fail instead of silently re-resolving.
      run: uv sync --frozen

    - name: Install dependencies (pip)
      if: inputs.installer == 'pip'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        REQUIREMENTS: ${{ inputs.requirements }}
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r "$REQUIREMENTS"
