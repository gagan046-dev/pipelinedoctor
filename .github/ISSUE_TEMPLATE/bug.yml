name: Bug report
description: PipelineDoctor diagnosed something wrong, a workflow misbehaves, or the Console breaks.
title: "fix: "
labels: [bug]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Engine / diagnosis
        - Doctor workflow / Docker action
        - Evals
        - Console
        - CI/CD workflows
        - Deployment / self-hosted runner
        - Demo project
    validations:
      required: true
  - type: input
    id: run
    attributes:
      label: Run or occurrence
      description: Link to the Actions run, or the occurrence id (e.g. PD-2026-0042).
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log lines
      description: Remove tokens and secrets before pasting. Logs here are public.
      render: text
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `pipelinedoctor version` or the Console's /version.
