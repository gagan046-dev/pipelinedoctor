server {
    listen 8080;
    server_name _;

    # Docker's embedded DNS. Because proxy_pass below uses a variable, nginx resolves the
    # host name per request (cached 10 s) instead of once at start-up: the proxy starts even
    # when no console is running, and a recreated console container is found again.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 3s;

    # Defines $pd_backend and $pd_color. Rewritten by switch-color.sh, then `nginx -s reload`.
    include /etc/nginx/pd/upstream.conf;

    location = /proxy-healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","color":"$pd_color"}';
    }

    location / {
        proxy_pass $pd_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        add_header X-PD-Color $pd_color always;
    }
}
