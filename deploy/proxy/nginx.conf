# Everything nginx writes at runtime goes to /tmp, so the container can run with a
# read-only root filesystem (compose mounts a tmpfs at /tmp).
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    log_format pd '$remote_addr [$time_iso8601] "$request" $status $body_bytes_sent '
                  'color=$pd_color upstream=$upstream_addr rt=$request_time';
    access_log /dev/stdout pd;

    server_tokens off;
    sendfile on;
    keepalive_timeout 65;

    include /etc/nginx/conf.d/*.conf;
}
